name: Build LaTeX to PDF & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Create output directory
        run: mkdir -p docs

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Compile PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          cp main.pdf docs/main.pdf

      - name: Copy scatter plot
        run: |
          if [ -f scatter.pdf ]; then
            cp scatter.pdf docs/scatter.pdf
          fi

      - name: Create index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FIFA World Cup 2026 Bracket Fairness</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: #f5f5f5;
              }
              .header {
                background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
                color: white;
                padding: 40px 20px;
                text-align: center;
              }
              .header h1 { font-size: 2em; margin-bottom: 10px; }
              .header p { font-size: 1.1em; opacity: 0.95; }
              .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
              .controls {
                background: white;
                padding: 20px;
                border-radius: 8px;
                margin: 20px 0;
                display: flex;
                gap: 15px;
              }
              .btn {
                padding: 12px 24px;
                border-radius: 5px;
                font-weight: bold;
                border: none;
                cursor: pointer;
                font-size: 1em;
                transition: background 0.3s;
              }
              .btn-pdf {
                background: #0066cc;
                color: white;
                text-decoration: none;
              }
              .btn-pdf:hover {
                background: #0052a3;
              }
              .btn-download {
                background: #28a745;
                color: white;
              }
              .btn-download:hover {
                background: #218838;
              }
              .viewer {
                background: white;
                border-radius: 8px;
                overflow: hidden;
              }
              .viewer iframe {
                width: 100%;
                height: 900px;
                border: none;
              }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>Evaluating the Fairness of the Knockout Brackets at the FIFA World Cup 2026</h1>
              <p><strong>Author:</strong> Saketaram Manikantan | <strong>Date:</strong> July 2026</p>
            </div>
            
            <div class="container">
              <div class="controls">
                <a href="main.pdf" target="_blank" class="btn btn-pdf">👁️ View PDF</a>
                <a href="main.pdf" download class="btn btn-download">⬇️ Download PDF</a>
              </div>
              
              <div class="viewer">
                <iframe src="main.pdf"></iframe>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: List built files
        run: ls -la docs/

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git commit -m "Build: Compile LaTeX to PDF" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
