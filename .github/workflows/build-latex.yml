name: Build LaTeX to HTML & PDF

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LaTeX and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended pandoc

      - name: Create output directory
        run: mkdir -p docs

      - name: Compile PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex || echo "First pass done"
          pdflatex -interaction=nonstopmode -halt-on-error main.tex || echo "Second pass done"
          ls -la *.pdf || echo "No PDF found"

      - name: Move PDF to docs
        run: |
          if [ -f main.pdf ]; then
            cp main.pdf docs/main.pdf
            echo "PDF copied successfully"
          else
            echo "ERROR: main.pdf not found"
          fi

      - name: Convert to HTML
        run: pandoc main.tex -o docs/main.html --mathjax --standalone --toc

      - name: Copy scatter plot
        run: |
          if [ -f scatter.pdf ]; then
            cp scatter.pdf docs/scatter.pdf
            echo "scatter.pdf copied"
          else
            echo "WARNING: scatter.pdf not found in repo"
          fi

      - name: Create index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>FIFA World Cup 2026 Bracket Fairness</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
              h1 { color: #333; }
              a { color: #0066cc; text-decoration: none; margin-right: 20px; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Evaluating the Fairness of the Knockout Brackets at the FIFA World Cup 2026</h1>
            <p><strong>Author:</strong> Saketaram Manikantan | <strong>Date:</strong> July 2026</p>
            <h2>View the Paper</h2>
            <div>
              <a href="main.html">📄 Read as HTML</a>
              <a href="main.pdf">📋 Download PDF</a>
            </div>
          </body>
          </html>
          EOF

      - name: List built files
        run: ls -la docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
