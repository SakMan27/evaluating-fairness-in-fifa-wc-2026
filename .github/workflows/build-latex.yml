name: Build LaTeX to HTML & PDF

on:
  push:
    paths:
      - 'main.tex'
      - 'scatter.pdf'
      - '.github/workflows/build-latex.yml'
  pull_request:
    paths:
      - 'main.tex'
      - 'scatter.pdf'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            cm-super \
            dvipng

      - name: Create docs directory
        run: mkdir -p docs

      - name: Build PDF with pdflatex
        run: |
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
          mv main.pdf docs/

      - name: Convert LaTeX to HTML with pandoc
        run: pandoc main.tex -o docs/main.html --mathjax --standalone --toc

      - name: Copy scatter.pdf to docs
        run: cp scatter.pdf docs/

      - name: Create index page
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>FIFA World Cup 2026 Bracket Fairness</title>
            <style>
              body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
              h1 { color: #333; }
              a { color: #0066cc; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .links { margin: 20px 0; }
            </style>
          </head>
          <body>
            <h1>Evaluating the Fairness of the Knockout Brackets at the FIFA World Cup 2026</h1>
            <p><strong>Author:</strong> Saketaram Manikantan | <strong>Date:</strong> July 2026</p>
            
            <div class="links">
              <h2>View the Paper</h2>
              <ul>
                <li><a href="main.html">📄 Read as HTML</a></li>
                <li><a href="main.pdf">📋 Download PDF</a></li>
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Commit and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Build: render LaTeX to HTML & PDF" && git push)
